name: Reset Verification on Push

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  reset-label:
    name: Reset Verification on Push
    runs-on: ubuntu-latest
    steps:
      - name: Check and Reset verify-build Label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request?.labels || []).map(l => l.name);
            if (labels.includes('verify-build')) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.payload.pull_request.number,
                  name: 'verify-build'
                });
                console.log('Successfully removed verify-build label following push.');
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
              }
            } else {
              console.log('No verify-build label present on PR; nothing to reset.');
            }
