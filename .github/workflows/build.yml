name: Build FreeTerraForged

on:
  push:
    branches:
      - '1.21.1_unstable'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.AUTOVERSION_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fix potential CRLF line endings on gradlew committed from Windows
      - name: Normalize Gradle Executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      # Caches Gradle dependencies, wrapper, and build metadata
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Increment build number in gradle.properties and commit back to branch
      - name: Bump Version in gradle.properties
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          MAJOR_MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f1,2)
          BUILD_NUM=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # 10# forces base-10 to avoid octal parsing errors on 0008, 0009
          NEXT_NUM=$((10#$BUILD_NUM + 1))
          WIDTH=${#BUILD_NUM}
          NEW_BUILD=$(printf "%0*d" "$WIDTH" "$NEXT_NUM")
          NEW_VERSION="${MAJOR_MINOR}.${NEW_BUILD}"

          echo "Bumping mod_version: ${CURRENT_VERSION} -> ${NEW_VERSION}"
          sed -i "s/^mod_version=.*/mod_version=${NEW_VERSION}/" gradle.properties

          # Commit and push back to the branch with [skip ci] to prevent recursion
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore(version): bump mod_version to ${NEW_VERSION} [skip ci]"
          git push origin "${{ github.ref_name }}"

          # Export for subsequent steps
          echo "MOD_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Build Mod
        run: ./gradlew build --no-daemon

      - name: Prepare Artifacts
        shell: bash
        run: |
          set -euo pipefail

          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')

          echo "Mod version: ${MOD_VERSION}"
          echo "Minecraft version: ${MC_VERSION}"

          mkdir -p dist

          find_jar() {
            local dir="$1"
            find "$dir" -maxdepth 1 -type f \
              -name 'freeterraforged-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev*.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-shadow.jar'
          }

          FABRIC_JAR=$(find_jar fabric/build/libs)
          NEOFORGE_JAR=$(find_jar neoforge/build/libs)

          if [[ -z "$FABRIC_JAR" ]]; then
            echo "::error::Fabric JAR not found"
            ls -la fabric/build/libs/ || true
            exit 1
          fi

          if [[ -z "$NEOFORGE_JAR" ]]; then
            echo "::error::NeoForge JAR not found"
            ls -la neoforge/build/libs/ || true
            exit 1
          fi

          # Name artifacts with the incremented version (no sha needed)
          cp "$FABRIC_JAR" "dist/ftf-unstable-${MOD_VERSION}+mc${MC_VERSION}-fabric.jar"
          cp "$NEOFORGE_JAR" "dist/ftf-unstable-${MOD_VERSION}+mc${MC_VERSION}-neoforge.jar"

          echo "Prepared artifacts:"
          ls -lh dist/

      # 1. Historical run artifact (accessible in Actions tab for 30 days)
      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftf-unstable-${{ env.MOD_VERSION }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      # 2. Publishes raw uncompressed JARs directly to a rolling GitHub Pre-Release
      - name: Deploy Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.21.1_unstable-latest"
          name: "1.21.1_unstable (Latest Dev Build)"
          body: |
            > [!WARNING]
            > **UNSTABLE DEVELOPMENT BUILD — FOR TESTING ONLY**
            > 
            > This build is automatically generated from the bleeding-edge `1.21.1_unstable` branch.
            > It may contain breaking bugs, experimental changes, or terrain generation anomalies.

            ---
            * **Version**: `${{ env.MOD_VERSION }}`
            * **Commit**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            * **Build Time**: ${{ github.event.head_commit.timestamp || 'N/A' }}
          prerelease: true
          make_latest: false
          files: |
            dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOVERSION_PAT || secrets.GITHUB_TOKEN }}
