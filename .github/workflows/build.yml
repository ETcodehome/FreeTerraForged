name: Build FreeTerraForged Mod

on:
  push:
  pull_request:
jobs:
  build:
    name: Build & upload jars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build

      - name: Read Mod Version
        id: read_mod_version
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2-)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT

      - name: Upload Neoforge jar
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-${{ steps.read_mod_version.outputs.mod_version }}-${{ github.sha}}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*shadow*

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: fabric-${{ steps.read_mod_version.outputs.mod_version }}-${{ github.sha}}
          path: |
            fabric/build/libs/*.jar
