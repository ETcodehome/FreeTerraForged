name: Build

on:
  push:
    # All commits to any branch (and tags)
  pull_request:
    # PRs from any source/target branch

jobs:
  build:
    name: Build & upload production jars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jars artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*shadow*
