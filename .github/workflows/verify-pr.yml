name: PR Preset Verification

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # When a fresh commit is pushed, automatically strip the verify-build label so
  # incremental WIP commits don't trigger heavy builds until a reviewer re-approves.
  reset-label:
    name: Reset Verification on Push
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'verify-build')
    runs-on: ubuntu-latest
    steps:
      - name: Remove verify-build Label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: 'verify-build'
              });
              console.log('Removed verify-build label following new commit push.');
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
            }

  preset-test:
    name: Verify Presets (Fabric & NeoForge)
    # Only execute when the label is explicitly attached by a reviewer
    if: github.event.action == 'labeled' && github.event.label.name == 'verify-build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Fix potential CRLF line endings on gradlew committed from Windows
      - name: Normalize Gradle Executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      # Caches Gradle & Loom dependencies between PR runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Executes :fabric:runPresetTest and :neoforge:runPresetTest sequentially
      - name: Run Headless Preset Validation
        id: run_preset_test
        run: ./gradlew runPresetTest --no-daemon

      # Uploads visual heightmap & reliefmap PNGs generated during the test
      - name: Upload Test Heightmaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-heightmaps
          path: build/reports/preset-test-heightmaps/
          if-no-files-found: ignore
          retention-days: 7

      # Publishes visual PNGs to an isolated orphan branch for direct raw inline rendering
      - name: Publish Visual Assets to Verification Branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          REPORT_DIR="build/reports/preset-test-heightmaps"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "No reports directory found; skipping asset publication."
            exit 0
          fi

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git clone --depth 1 --branch verification-assets "$REPO_URL" repo 2>/dev/null; then
            cd repo
          else
            mkdir repo && cd repo
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan verification-assets
          fi

          mkdir -p "pr-${PR_NUM}"

          # Explicit mapping of specific test outputs
          FABRIC_SPAWN=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -type f -iname "*fabric*ftf*_visual.png" 2>/dev/null | head -n 1)
          if [ -z "$FABRIC_SPAWN" ]; then
            FABRIC_SPAWN=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -type f -iname "*fabric*_visual.png" ! -iname "*continuity*" 2>/dev/null | head -n 1)
          fi

          NEOFORGE_SPAWN=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -type f -iname "*neoforge*ftf*_visual.png" 2>/dev/null | head -n 1)
          if [ -z "$NEOFORGE_SPAWN" ]; then
            NEOFORGE_SPAWN=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -type f -iname "*neoforge*_visual.png" ! -iname "*continuity*" 2>/dev/null | head -n 1)
          fi

          if [ -n "$FABRIC_SPAWN" ]; then
            cp "$FABRIC_SPAWN" "pr-${PR_NUM}/fabric_spawn_relief.png"
          fi
          if [ -n "$NEOFORGE_SPAWN" ]; then
            cp "$NEOFORGE_SPAWN" "pr-${PR_NUM}/neoforge_spawn_relief.png"
          fi

          git add "pr-${PR_NUM}"
          if ! git diff --cached --quiet; then
            git commit -m "Update visual assets for PR #${PR_NUM} [skip ci]"
            git push origin verification-assets
          else
            echo "Visual assets unchanged."
          fi

      # Rigorous Verification Validator & Executive Report Generator
      - name: Validate Test Results & Publish Executive Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number;
            const reportDir = 'build/reports/preset-test-heightmaps';
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const testStepSuccess = '${{ steps.run_preset_test.outcome }}' === 'success';

            const failures = [];
            const parsedSuites = [];

            if (!testStepSuccess) {
              failures.push("Gradle task execution (`./gradlew runPresetTest`) exited with a non-zero exit code.");
            }

            if (!fs.existsSync(reportDir)) {
              failures.push(`Expected report directory '${reportDir}' was not generated. Headless server suite may have crashed during bootstrap.`);
            } else {
              const files = fs.readdirSync(reportDir);
              const txtReports = files.filter(f => f.endsWith('_report.txt'));

              for (const file of txtReports) {
                const content = fs.readFileSync(path.join(reportDir, file), 'utf8');
                const isFabric = content.toLowerCase().includes('loader: fabric') || file.toLowerCase().includes('fabric');
                const loaderName = isFabric ? 'Fabric' : 'NeoForge';
                const passed = content.includes('Outcome: PASSED');

                if (content.includes('Heightmap Validation Report')) {
                  const spawnMatch = content.match(/Spawn Chunk:\s*([^\r\n]+)/);
                  const spanMatch = content.match(/Elevation Span:\s*([^\r\n]+)/);
                  const presetMatch = content.match(/Preset:\s*([^\r\n]+)/);
                  const maxStepMatch = content.match(/Max Adjacent Step:\s*([^\r\n]+)/);

                  const preset = presetMatch ? presetMatch[1].trim() : 'ftf';
                  const spawn = spawnMatch ? spawnMatch[1].trim() : 'Unknown';
                  const span = spanMatch ? spanMatch[1].trim() : 'Unknown';
                  const maxStep = maxStepMatch ? maxStepMatch[1].trim() : 'Unknown';

                  if (!passed) {
                    failures.push(`${loaderName} Spawn Heightmap Validation failed.`);
                  }

                  parsedSuites.push({
                    suite: 'Spawn Heightmap & Regularity',
                    loader: loaderName,
                    target: `Preset \`${preset}\` @ ${spawn}`,
                    metrics: `Span: ${span}, Max Step: ${maxStep}`,
                    passed,
                    statusText: passed ? '✓ PASSED' : '✗ FAILED',
                    log: content.trim()
                  });
                } else if (content.includes('Multi-Run Seam Continuity Report')) {
                  const presetMatch = content.match(/World Base Preset:\s*([^\r\n]+)/);
                  const seamStepMatch = content.match(/Actual Max Seam Step:\s*([^\r\n]+)/);
                  const parityMatch = content.match(/Session 3 vs Baseline:\s*([^\r\n]+)/);
                  const pmMatch = content.match(/PM\.loadCheck\(\):\s*([^\r\n]+)/);

                  const preset = presetMatch ? presetMatch[1].trim() : 'Huge Biomes';
                  const seamStep = seamStepMatch ? seamStepMatch[1].trim() : 'Unknown';
                  const parity = parityMatch ? parityMatch[1].trim() : 'Identical';
                  const pm = pmMatch ? pmMatch[1].trim() : 'PASSED';

                  if (!passed) {
                    failures.push(`${loaderName} Multi-Run Seam Continuity failed.`);
                  }

                  parsedSuites.push({
                    suite: 'Multi-Run Seam Continuity',
                    loader: loaderName,
                    target: `Preset \`${preset}\` (Issue #330)`,
                    metrics: `Seam Step: ${seamStep}, Parity: ${parity}`,
                    passed,
                    statusText: passed ? '✓ PASSED' : '✗ FAILED',
                    log: content.trim()
                  });
                }
              }
            }

            // Verify that all 4 expected suites were executed
            const expectedSuites = [
              { suite: 'Spawn Heightmap & Regularity', loader: 'Fabric' },
              { suite: 'Spawn Heightmap & Regularity', loader: 'NeoForge' },
              { suite: 'Multi-Run Seam Continuity', loader: 'Fabric' },
              { suite: 'Multi-Run Seam Continuity', loader: 'NeoForge' }
            ];

            for (const exp of expectedSuites) {
              const found = parsedSuites.find(s => s.suite === exp.suite && s.loader === exp.loader);
              if (!found) {
                failures.push(`Missing expected test run: ${exp.suite} on ${exp.loader}.`);
              }
            }

            const overallPassed = failures.length === 0;

            // --- BUILD EXECUTIVE REPORT ---
            let report = '';
            if (overallPassed) {
              report += `## 🗺️ FreeTerraForged Verification Report: ✓ PASSED\n\n`;
            } else {
              report += `## 🗺️ FreeTerraForged Verification Report: ✗ FAILED\n\n`;
            }

            report += `> **Commit:** [\`${sha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) | **Run:** [#${context.runId}](${runUrl}) | **Suites Verified:** ${parsedSuites.filter(s => s.passed).length} / ${expectedSuites.length}\n\n`;

            if (!overallPassed) {
              report += `> [!CAUTION]\n`;
              report += `> **Verification Failures Detected:**\n`;
              for (const f of failures) {
                report += `> - ${f}\n`;
              }
              report += `\n`;
            }

            // Image-First Visibility: Visual Shaded Relief Map Cards
            if (prNumber) {
              const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/verification-assets/pr-${prNumber}`;
              const fabricImg = `${rawBase}/fabric_spawn_relief.png?v=${sha}`;
              const neoforgeImg = `${rawBase}/neoforge_spawn_relief.png?v=${sha}`;

              report += `### 🌄 Worldgen Shaded Relief Previews (Live Spawn)\n\n`;
              report += `<table>\n<tr>\n`;
              report += `<th align="center" width="50%">Fabric Shaded Relief</th>\n`;
              report += `<th align="center" width="50%">NeoForge Shaded Relief</th>\n`;
              report += `</tr>\n<tr>\n`;
              report += `<td align="center"><a href="${fabricImg}"><img src="${fabricImg}" width="100%" alt="Fabric Spawn Relief" /></a></td>\n`;
              report += `<td align="center"><a href="${neoforgeImg}"><img src="${neoforgeImg}" width="100%" alt="NeoForge Spawn Relief" /></a></td>\n`;
              report += `</tr>\n</table>\n\n`;
            }

            // Test Suite Execution Matrix
            report += `### 📋 Test Suite Execution Matrix\n\n`;
            report += `| Test Suite | Loader | Target Configuration | Key Metrics | Outcome |\n`;
            report += `| :--- | :--- | :--- | :--- | :--- |\n`;

            for (const s of parsedSuites) {
              report += `| **${s.suite}** | **${s.loader}** | ${s.target} | ${s.metrics} | \`${s.statusText}\` |\n`;
            }
            report += `\n`;

            // Collapsible Detailed Logs
            if (parsedSuites.length > 0) {
              report += `<details>\n<summary><b>🔍 Detailed Diagnostic Logs (${parsedSuites.length} suites)</b></summary>\n\n`;
              for (const s of parsedSuites) {
                report += `#### ${s.loader}: ${s.suite} (${s.statusText})\n\n\`\`\`text\n${s.log}\n\`\`\`\n\n`;
              }
              report += `</details>\n\n`;
            }

            report += `---\n*Artifacts: [Download Raw Heightmaps & Diagnostic Outputs](${runUrl})*`;

            // 1. Write to GitHub Step Summary (opens from "Details" on the PR verification check)
            await core.summary.addRaw(report).write();

            // 2. Post or update the sticky comment on the PR conversation thread
            if (prNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: prNumber
              });

              const botComment = comments.find(c => c.body.includes('FreeTerraForged Verification Report:'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: botComment.id,
                  body: report
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body: report
                });
              }
            }

            // STRICT ENFORCEMENT: Fail the GitHub Actions job if verification failed or missing
            if (!overallPassed) {
              core.setFailed(`Preset Verification Failed: ${failures.join('; ')}`);
            }
