name: PR Preset Verification

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # When a fresh commit is pushed, automatically strip the verify-build label so
  # incremental WIP commits don't trigger heavy builds until a reviewer re-approves.
  reset-label:
    name: Reset Verification on Push
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'verify-build')
    runs-on: ubuntu-latest
    steps:
      - name: Remove verify-build Label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: 'verify-build'
              });
              console.log('Removed verify-build label following new commit push.');
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
            }

  preset-test:
    name: Verify Presets (Fabric & NeoForge)
    # Only execute when the label is explicitly attached by a reviewer
    if: github.event.action == 'labeled' && github.event.label.name == 'verify-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Fix potential CRLF line endings on gradlew committed from Windows
      - name: Normalize Gradle Executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      # Caches Gradle & Loom dependencies between PR runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Executes :fabric:runPresetTest and :neoforge:runPresetTest sequentially
      - name: Run Headless Preset Validation
        id: run_preset_test
        run: ./gradlew runPresetTest --no-daemon

      # Uploads visual heightmap & reliefmap PNGs generated during the test
      - name: Upload Test Heightmaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-heightmaps
          path: build/reports/preset-test-heightmaps/
          if-no-files-found: ignore
          retention-days: 7

      # Publishes visual PNGs to an isolated orphan branch for direct raw inline rendering
      - name: Publish Visual Assets to Verification Branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          REPORT_DIR="build/reports/preset-test-heightmaps"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "No reports directory found; skipping asset publication."
            exit 0
          fi

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git clone --depth 1 --branch verification-assets "$REPO_URL" repo 2>/dev/null; then
            cd repo
          else
            mkdir repo && cd repo
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan verification-assets
          fi

          mkdir -p "pr-${PR_NUM}"

          copy_asset() {
            local pattern="$1"
            local dest="$2"
            local exclude="${3:-}"
            local match
            if [ -n "$exclude" ]; then
              match=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -maxdepth 1 -type f -iname "$pattern" ! -iname "$exclude" 2>/dev/null | sort | tail -n 1)
            else
              match=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -maxdepth 1 -type f -iname "$pattern" 2>/dev/null | sort | tail -n 1)
            fi
            if [ -n "$match" ] && [ -f "$match" ]; then
              cp -f "$match" "pr-${PR_NUM}/$dest"
              echo "Copied $match -> pr-${PR_NUM}/$dest"
            else
              echo "No asset match found for pattern: $pattern (exclude: $exclude)"
            fi
          }

          # Live Spawn Heightmap & Shaded Relief
          copy_asset "*fabric*ftf*_visual.png" "fabric_spawn_relief.png"
          copy_asset "*fabric*ftf*.png" "fabric_spawn_raw.png" "*_visual.png"
          copy_asset "*neoforge*ftf*_visual.png" "neoforge_spawn_relief.png"
          copy_asset "*neoforge*ftf*.png" "neoforge_spawn_raw.png" "*_visual.png"

          # Multi-Run Seam Continuity (Issue #330)
          copy_asset "*fabric*multirun*_visual.png" "fabric_seam_relief.png"
          copy_asset "*fabric*multirun*.png" "fabric_seam_raw.png" "*_visual.png"
          copy_asset "*neoforge*multirun*_visual.png" "neoforge_seam_relief.png"
          copy_asset "*neoforge*multirun*.png" "neoforge_seam_raw.png" "*_visual.png"

          # In-Game Commands /ftf reliefmap & /ftf heightmap
          copy_asset "reliefmap*fabric*ingame_command*.png" "fabric_command_relief.png"
          copy_asset "heightmap*fabric*ingame_command*.png" "fabric_command_raw.png"
          copy_asset "reliefmap*neoforge*ingame_command*.png" "neoforge_command_relief.png"
          copy_asset "heightmap*neoforge*ingame_command*.png" "neoforge_command_raw.png"

          # Archive any other png outputs to pr directory
          cp -f "$GITHUB_WORKSPACE/$REPORT_DIR"/*.png "pr-${PR_NUM}/" 2>/dev/null || true

          git add "pr-${PR_NUM}"
          if ! git diff --cached --quiet; then
            git commit -m "Update visual assets for PR #${PR_NUM} [skip ci]"
            git push origin verification-assets
          else
            echo "Visual assets unchanged."
          fi

      # Rigorous Verification Validator & Executive Report Generator
      - name: Validate Test Results & Publish Executive Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number;
            const reportDir = 'build/reports/preset-test-heightmaps';
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const testStepSuccess = '${{ steps.run_preset_test.outcome }}' === 'success';

            const failures = [];
            const parsedSuites = [];

            if (!testStepSuccess) {
              failures.push("Gradle task execution (`./gradlew runPresetTest`) exited with a non-zero exit code.");
            }

            // Default order of all real tests in the suite (no explicit numbering)
            const allTests = [
              'Live Server Datapack & Registry Resolution',
              'Spawn Chunk Heightmap & Regularity',
              'Built-in Default Fallback (Rivers)',
              'User-Selected Default Preset (Upscaled Community)',
              'Manual Preset Selection Overrule (Huge Biomes)',
              'World Type Cycling Preservation',
              'Dedicated Server Successive Run Preservation',
              'Re-create World Flow Preservation',
              'Custom File-Based Default Preset Resolution',
              'Multi-Run Seam Continuity (Issue #330)',
              'In-Game Command Execution & Parity (/ftf commands)',
              'Two-Stage Datapack Reload & User Spawn Persistence'
            ];

            const detailedReports = [];

            if (!fs.existsSync(reportDir)) {
              failures.push(`Expected report directory '${reportDir}' was not generated. Headless server suite may have crashed during bootstrap.`);
            } else {
              const files = fs.readdirSync(reportDir);
              const txtReports = files.filter(f => f.endsWith('_report.txt'));

              // 1. First parse structured suite_summary reports
              for (const file of txtReports) {
                const content = fs.readFileSync(path.join(reportDir, file), 'utf8');
                const isFabric = content.toLowerCase().includes('loader: fabric') || file.toLowerCase().includes('fabric');
                const loaderName = isFabric ? 'Fabric' : 'NeoForge';

                if (content.includes('FreeTerraForged Test Execution Report')) {
                  const entries = content.split('[Test Entry]').slice(1);
                  for (const entry of entries) {
                    const nameMatch = entry.match(/Name:\s*([^\r\n]+)/);
                    const outcomeMatch = entry.match(/Outcome:\s*([^\r\n]+)/);
                    const notesMatch = entry.match(/Notes:\s*([^\r\n]+)/);
                    const errorMatch = entry.match(/Error:\s*([^\r\n]+)/);

                    const testName = nameMatch ? nameMatch[1].trim() : 'Unknown Test';
                    const passed = outcomeMatch ? outcomeMatch[1].trim() === 'PASSED' : false;
                    const notes = notesMatch ? notesMatch[1].trim() : '';
                    const error = errorMatch ? errorMatch[1].trim() : '';

                    if (!passed) {
                      failures.push(`${loaderName} ${testName} failed: ${error || 'Test failure recorded.'}`);
                    }

                    parsedSuites.push({
                      name: testName,
                      loader: loaderName,
                      target: notes || (passed ? 'Verified' : error),
                      passed,
                      statusText: passed ? '✓ PASSED' : '✗ FAILED',
                      log: entry.trim()
                    });
                  }
                } else if (content.includes('Test Watchdog Failure Report')) {
                  const failedStepMatch = content.match(/Failed Step:\s*([^\r\n]+)/);
                  const reasonMatch = content.match(/Reason:\s*([^\r\n]+)/);
                  const failedStep = failedStepMatch ? failedStepMatch[1].trim() : 'Unknown';
                  const reason = reasonMatch ? reasonMatch[1].trim() : 'Test watchdog timeout';

                  failures.push(`${loaderName} WATCHDOG TIMEOUT on ${failedStep}: ${reason}`);

                  parsedSuites.push({
                    name: `Watchdog Timeout (${failedStep})`,
                    loader: loaderName,
                    target: `Failure: ${reason}`,
                    passed: false,
                    statusText: '✗ TIMEOUT',
                    log: content.trim()
                  });
                } else {
                  // Keep detailed specialized reports (heightmap, continuity, commands) for diagnostic logs
                  detailedReports.push({ file, content, loaderName });
                }
              }
            }

            // Dynamically register any new tests found in the execution reports that weren't in default list
            for (const s of parsedSuites) {
              if (!allTests.includes(s.name) && !s.name.startsWith('Watchdog Timeout')) {
                allTests.push(s.name);
              }
            }

            // Assert that all real tests ran and passed on both loaders
            for (const testName of allTests) {
              for (const loader of ['Fabric', 'NeoForge']) {
                const found = parsedSuites.find(s => s.name === testName && s.loader === loader);
                if (!found) {
                  failures.push(`Missing expected test run: "${testName}" on ${loader}.`);
                }
              }
            }

            const overallPassed = failures.length === 0;

            // --- BUILD EXECUTIVE REPORT ---
            let report = '';
            if (overallPassed) {
              report += `## 🗺️ FreeTerraForged Verification Report: ✓ PASSED\n\n`;
            } else {
              report += `## 🗺️ FreeTerraForged Verification Report: ✗ FAILED\n\n`;
            }

            const totalExpected = allTests.length * 2;
            const passedCount = parsedSuites.filter(s => s.passed && allTests.includes(s.name)).length;
            report += `> **Commit:** [\`${sha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) | **Run:** [#${context.runId}](${runUrl}) | **Suites Verified:** ${passedCount} / ${totalExpected}\n\n`;

            if (!overallPassed) {
              report += `> [!CAUTION]\n`;
              report += `> **Verification Failures Detected:**\n`;
              for (const f of failures) {
                report += `> - ${f}\n`;
              }
              report += `\n`;
            }

            // Asset URL Base
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/verification-assets/pr-${prNumber}`;

            // Image mappings for inlining in the per-test line summary
            const imageMap = {
              'Spawn Chunk Heightmap & Regularity_Fabric': [
                { file: 'fabric_spawn_relief.png', title: 'Fabric Spawn Relief Preview', label: 'Relief' },
                { file: 'fabric_spawn_raw.png', title: 'Fabric Spawn Raw Heightmap', label: 'Raw' }
              ],
              'Spawn Chunk Heightmap & Regularity_NeoForge': [
                { file: 'neoforge_spawn_relief.png', title: 'NeoForge Spawn Relief Preview', label: 'Relief' },
                { file: 'neoforge_spawn_raw.png', title: 'NeoForge Spawn Raw Heightmap', label: 'Raw' }
              ],
              'Multi-Run Seam Continuity (Issue #330)_Fabric': [
                { file: 'fabric_seam_relief.png', title: 'Fabric Seam Continuity Relief Preview', label: 'Seam Relief' },
                { file: 'fabric_seam_raw.png', title: 'Fabric Seam Continuity Raw Heightmap', label: 'Seam Raw' }
              ],
              'Multi-Run Seam Continuity (Issue #330)_NeoForge': [
                { file: 'neoforge_seam_relief.png', title: 'NeoForge Seam Continuity Relief Preview', label: 'Seam Relief' },
                { file: 'neoforge_seam_raw.png', title: 'NeoForge Seam Continuity Raw Heightmap', label: 'Seam Raw' }
              ],
              'In-Game Command Execution & Parity (/ftf commands)_Fabric': [
                { file: 'fabric_command_relief.png', title: 'Fabric /ftf reliefmap In-Game Command', label: 'Cmd Relief' },
                { file: 'fabric_command_raw.png', title: 'Fabric /ftf heightmap In-Game Command', label: 'Cmd Raw' }
              ],
              'In-Game Command Execution & Parity (/ftf commands)_NeoForge': [
                { file: 'neoforge_command_relief.png', title: 'NeoForge /ftf reliefmap In-Game Command', label: 'Cmd Relief' },
                { file: 'neoforge_command_raw.png', title: 'NeoForge /ftf heightmap In-Game Command', label: 'Cmd Raw' }
              ]
            };

            // Test Suite Execution Matrix (Cross-loader runs of each test grouped together)
            report += `| image results (if applicable) | test name | loader env | target configuration notes | clean pass/fail indication |\n`;
            report += `| :---: | :--- | :---: | :--- | :---: |\n`;

            for (const testName of allTests) {
              for (const loader of ['Fabric', 'NeoForge']) {
                const suiteData = parsedSuites.find(s => s.name === testName && s.loader === loader);
                const key = `${testName}_${loader}`;
                const images = imageMap[key] || [];

                let imgHtml = '—';
                if (prNumber && images.length > 0) {
                  imgHtml = images.map(img =>
                    `<a href="${rawBase}/${img.file}?v=${sha}"><img src="${rawBase}/${img.file}?v=${sha}" width="90" title="${img.title}" alt="${img.label}" /></a>`
                  ).join('&nbsp;');
                }

                const targetNotes = suiteData ? suiteData.target : 'Test execution not found';
                const status = suiteData ? `\`${suiteData.statusText}\`` : '`✗ NOT RUN`';

                report += `| ${imgHtml} | **${testName}** | **${loader}** | ${targetNotes} | ${status} |\n`;
              }
            }

            // Include any unexpected watchdog timeout rows if present
            const timeouts = parsedSuites.filter(s => s.name.startsWith('Watchdog Timeout'));
            for (const t of timeouts) {
              report += `| — | **${t.name}** | **${t.loader}** | ${t.target} | \`${t.statusText}\` |\n`;
            }

            report += `\n`;

            // Collapsible Detailed Logs
            if (detailedReports.length > 0 || parsedSuites.length > 0) {
              report += `<details>\n<summary><b>🔍 Detailed Diagnostic Logs (${parsedSuites.length} test records, ${detailedReports.length} reports)</b></summary>\n\n`;
              for (const d of detailedReports) {
                report += `#### ${d.loaderName}: ${d.file}\n\n\`\`\`text\n${d.content.trim()}\n\`\`\`\n\n`;
              }
              report += `</details>\n\n`;
            }

            report += `---\n*Artifacts: [Download Raw Heightmaps & Diagnostic Outputs](${runUrl})*`;

            // 1. Write to GitHub Step Summary (opens from "Details" on the PR verification check)
            await core.summary.addRaw(report).write();

            // 2. Post or update the sticky comment on the PR conversation thread
            if (prNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: prNumber
              });

              const botComment = comments.find(c => c.body.includes('FreeTerraForged Verification Report:'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: botComment.id,
                  body: report
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body: report
                });
              }
            }

            // STRICT ENFORCEMENT: Fail the GitHub Actions job if verification failed or missing
            if (!overallPassed) {
              core.setFailed(`Preset Verification Failed: ${failures.join('; ')}`);
            }

            report += `---\n*Artifacts: [Download Raw Heightmaps & Diagnostic Outputs](${runUrl})*`;

            // 1. Write to GitHub Step Summary (opens from "Details" on the PR verification check)
            await core.summary.addRaw(report).write();

            // 2. Post or update the sticky comment on the PR conversation thread
            if (prNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: prNumber
              });

              const botComment = comments.find(c => c.body.includes('FreeTerraForged Verification Report:'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: botComment.id,
                  body: report
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body: report
                });
              }
            }

            // STRICT ENFORCEMENT: Fail the GitHub Actions job if verification failed or missing
            if (!overallPassed) {
              core.setFailed(`Preset Verification Failed: ${failures.join('; ')}`);
            }
