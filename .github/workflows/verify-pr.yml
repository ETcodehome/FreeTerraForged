name: PR Preset Verification

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  # Executes Fabric and NeoForge verification in parallel matrix runners
  preset-test:
    name: Verify Presets (${{ matrix.loader }})
    # Only execute when the label is explicitly attached by a reviewer
    if: github.event.label.name == 'verify-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        loader: [fabric, neoforge]
      fail-fast: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Fix potential CRLF line endings on gradlew committed from Windows
      - name: Normalize Gradle Executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      # Caches Gradle dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Caches Loom jar transformations and workspace cache per loader
      - name: Cache Loom Workspace
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            .gradle/loom-cache
            fabric/.gradle/loom-cache
            neoforge/.gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ matrix.loader }}-${{ hashFiles('**/libs.versions.toml', '**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-loom-${{ matrix.loader }}-
            ${{ runner.os }}-loom-

      # Executes :fabric:runPresetTest or :neoforge:runPresetTest in parallel
      - name: Run Headless Preset Validation
        id: run_preset_test
        run: ./gradlew :${{ matrix.loader }}:runPresetTest --no-daemon

      # Uploads visual heightmaps & test report files from this loader
      - name: Upload Test Outputs (${{ matrix.loader }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-test-artifacts-${{ matrix.loader }}
          path: build/reports/preset-test-heightmaps/
          if-no-files-found: ignore
          retention-days: 7

  # Consolidates matrix results, pushes visual assets, and publishes the executive report
  publish-report:
    name: Publish Executive Verification Report
    needs: preset-test
    if: always() && github.event.label.name == 'verify-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1

      - name: Download Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Consolidate Matrix Outputs
        run: |
          mkdir -p build/reports/preset-test-heightmaps
          if [ -d "downloaded-artifacts" ]; then
            find downloaded-artifacts -type f -exec cp -f {} build/reports/preset-test-heightmaps/ \;
          fi
          echo "Consolidated test outputs:"
          ls -la build/reports/preset-test-heightmaps/ || true

      # Publishes visual PNGs to an isolated orphan branch for direct raw inline rendering
      - name: Publish Visual Assets to Verification Branch
        shell: bash
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          REPORT_DIR="build/reports/preset-test-heightmaps"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "No reports directory found; skipping asset publication."
            exit 0
          fi

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git clone --depth 1 --branch verification-assets "$REPO_URL" repo 2>/dev/null; then
            cd repo
          else
            mkdir repo && cd repo
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan verification-assets
          fi

          mkdir -p "pr-${PR_NUM}"

          copy_asset() {
            local pattern="$1"
            local dest="$2"
            local exclude="${3:-}"
            local match
            if [ -n "$exclude" ]; then
              match=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -maxdepth 1 -type f -iname "$pattern" ! -iname "$exclude" 2>/dev/null | sort | tail -n 1)
            else
              match=$(find "$GITHUB_WORKSPACE/$REPORT_DIR" -maxdepth 1 -type f -iname "$pattern" 2>/dev/null | sort | tail -n 1)
            fi
            if [ -n "$match" ] && [ -f "$match" ]; then
              cp -f "$match" "pr-${PR_NUM}/$dest"
              echo "Copied $match -> pr-${PR_NUM}/$dest"
            else
              echo "No asset match found for pattern: $pattern (exclude: $exclude)"
            fi
          }

          # Live Spawn Heightmap & Shaded Relief
          copy_asset "*fabric*ftf*_visual.png" "fabric_spawn_relief.png"
          copy_asset "*fabric*ftf*.png" "fabric_spawn_raw.png" "*_visual.png"
          copy_asset "*neoforge*ftf*_visual.png" "neoforge_spawn_relief.png"
          copy_asset "*neoforge*ftf*.png" "neoforge_spawn_raw.png" "*_visual.png"

          # Multi-Run Seam Continuity (Issue #330)
          copy_asset "*fabric*multirun*_visual.png" "fabric_seam_relief.png"
          copy_asset "*fabric*multirun*.png" "fabric_seam_raw.png" "*_visual.png"
          copy_asset "*neoforge*multirun*_visual.png" "neoforge_seam_relief.png"
          copy_asset "*neoforge*multirun*.png" "neoforge_seam_raw.png" "*_visual.png"

          # In-Game Commands /ftf reliefmap & /ftf heightmap
          copy_asset "reliefmap*fabric*ingame_command*.png" "fabric_command_relief.png"
          copy_asset "heightmap*fabric*ingame_command*.png" "fabric_command_raw.png"
          copy_asset "reliefmap*neoforge*ingame_command*.png" "neoforge_command_relief.png"
          copy_asset "heightmap*neoforge*ingame_command*.png" "neoforge_command_raw.png"

          # Archive any other png outputs to pr directory
          cp -f "$GITHUB_WORKSPACE/$REPORT_DIR"/*.png "pr-${PR_NUM}/" 2>/dev/null || true

          git add "pr-${PR_NUM}"
          if ! git diff --cached --quiet; then
            git commit -m "Update visual assets for PR #${PR_NUM} [skip ci]"
            git push origin verification-assets
          else
            echo "Visual assets unchanged."
          fi

      # Rigorous Verification Validator & Executive Report Generator
      - name: Validate Test Results & Publish Executive Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number;
            const reportDir = 'build/reports/preset-test-heightmaps';
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            const sha = headSha.substring(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const failures = [];
            const parsedSuites = [];

            // Base tokens representing the 12 core test suites in canonical execution order
            const baseTestTokens = [
              'presetValidation.checkSynchronizedRegistry',
              'presetValidation.spawnChunkRegularity',
              'presetValidation.builtinRiversFallback',
              'presetValidation.userSelectedDefault',
              'presetValidation.manualSelectionOverrule',
              'presetValidation.worldTypeCycling',
              'presetValidation.successiveRunPreservation',
              'presetValidation.recreateWorldFlow',
              'presetValidation.customFileResolution',
              'presetValidation.multiRunSeamContinuity',
              'presetValidation.inGameCommandParity',
              'presetValidation.twoStageReloadSpawnPersistence'
            ];

            const detailedReports = [];

            if (!fs.existsSync(reportDir)) {
              failures.push(`Expected report directory '${reportDir}' was not found. Headless server suites may have failed during bootstrap.`);
            } else {
              const files = fs.readdirSync(reportDir);
              const txtReports = files.filter(f => f.endsWith('_report.txt'));

              // 1. Parse structured suite_summary reports
              for (const file of txtReports) {
                const content = fs.readFileSync(path.join(reportDir, file), 'utf8');
                const isFabric = content.toLowerCase().includes('loader: fabric') || file.toLowerCase().includes('fabric');
                const loaderName = isFabric ? 'fabric' : 'neoforge';

                if (content.includes('FreeTerraForged Test Execution Report')) {
                  const entries = content.split('[Test Entry]').slice(1);
                  for (const entry of entries) {
                    const nameMatch = entry.match(/Name:\s*([^\r\n]+)/);
                    const outcomeMatch = entry.match(/Outcome:\s*([^\r\n]+)/);
                    const notesMatch = entry.match(/Notes:\s*([^\r\n]+)/);
                    const errorMatch = entry.match(/Error:\s*([^\r\n]+)/);

                    const testToken = nameMatch ? nameMatch[1].trim() : 'unknownTest';
                    const passed = outcomeMatch ? outcomeMatch[1].trim() === 'PASSED' : false;
                    const notes = notesMatch ? notesMatch[1].trim() : '';
                    const error = errorMatch ? errorMatch[1].trim() : '';

                    if (!passed) {
                      failures.push(`${testToken} failed: ${error || 'Test failure recorded.'}`);
                    }

                    parsedSuites.push({
                      token: testToken,
                      loader: loaderName,
                      notes: notes || (passed ? 'Verified' : error),
                      passed,
                      error,
                      log: entry.trim()
                    });
                  }
                } else if (content.includes('Test Watchdog Failure Report')) {
                  const failedStepMatch = content.match(/Failed Step:\s*([^\r\n]+)/);
                  const reasonMatch = content.match(/Reason:\s*([^\r\n]+)/);
                  const failedStep = failedStepMatch ? failedStepMatch[1].trim() : 'Unknown';
                  const reason = reasonMatch ? reasonMatch[1].trim() : 'Test watchdog timeout';

                  failures.push(`${loaderName} WATCHDOG TIMEOUT on ${failedStep}: ${reason}`);

                  parsedSuites.push({
                    token: `watchdogTimeout.${failedStep}.${loaderName}`,
                    loader: loaderName,
                    notes: `Failure: ${reason}`,
                    passed: false,
                    error: reason,
                    log: content.trim()
                  });
                } else {
                  detailedReports.push({ file, content, loaderName });
                }
              }
            }

            // Ensure all 24 tokens exist in parsedSuites (12 tests x 2 loaders)
            for (const base of baseTestTokens) {
              for (const loader of ['fabric', 'neoforge']) {
                const expectedToken = `${base}.${loader}`;
                const found = parsedSuites.find(s => s.token === expectedToken);
                if (!found) {
                  failures.push(`Missing expected test execution: ${expectedToken}`);
                }
              }
            }

            const overallPassed = failures.length === 0;

            // Asset URL Base for visual PNGs
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/verification-assets/pr-${prNumber}`;

            // Visual image mapping per token
            const tokenImageMap = {
              'presetValidation.spawnChunkRegularity.fabric': [
                { file: 'fabric_spawn_relief.png', title: 'Fabric Spawn Relief Preview', label: 'Relief' },
                { file: 'fabric_spawn_raw.png', title: 'Fabric Spawn Raw Heightmap', label: 'Raw' }
              ],
              'presetValidation.spawnChunkRegularity.neoforge': [
                { file: 'neoforge_spawn_relief.png', title: 'NeoForge Spawn Relief Preview', label: 'Relief' },
                { file: 'neoforge_spawn_raw.png', title: 'NeoForge Spawn Raw Heightmap', label: 'Raw' }
              ],
              'presetValidation.multiRunSeamContinuity.fabric': [
                { file: 'fabric_seam_relief.png', title: 'Fabric Seam Continuity Relief Preview', label: 'Seam Relief' },
                { file: 'fabric_seam_raw.png', title: 'Fabric Seam Continuity Raw Heightmap', label: 'Seam Raw' }
              ],
              'presetValidation.multiRunSeamContinuity.neoforge': [
                { file: 'neoforge_seam_relief.png', title: 'NeoForge Seam Continuity Relief Preview', label: 'Seam Relief' },
                { file: 'neoforge_seam_raw.png', title: 'NeoForge Seam Continuity Raw Heightmap', label: 'Seam Raw' }
              ],
              'presetValidation.inGameCommandParity.fabric': [
                { file: 'fabric_command_relief.png', title: 'Fabric /ftf reliefmap Command', label: 'Cmd Relief' },
                { file: 'fabric_command_raw.png', title: 'Fabric /ftf heightmap Command', label: 'Cmd Raw' }
              ],
              'presetValidation.inGameCommandParity.neoforge': [
                { file: 'neoforge_command_relief.png', title: 'NeoForge /ftf reliefmap Command', label: 'Cmd Relief' },
                { file: 'neoforge_command_raw.png', title: 'NeoForge /ftf heightmap Command', label: 'Cmd Raw' }
              ]
            };

            // Build Executive Markdown Alert Callout
            let report = '';
            const totalExpected = baseTestTokens.length * 2;
            const passedCount = parsedSuites.filter(s => s.passed && baseTestTokens.some(b => s.token.startsWith(b))).length;

            if (overallPassed) {
              report += `![Pass](https://img.shields.io/badge/verification-passed-brightgreen?style=for-the-badge)&nbsp;&nbsp;Commit: [\`${sha}\`](${commitUrl}) | Run: [#${context.runId}](${runUrl}) | ${passedCount} / ${totalExpected} Tests Run\n\n`;
            } else {
              report += `![Fail](https://img.shields.io/badge/verification-failed-red?style=for-the-badge)&nbsp;&nbsp;Commit: [\`${sha}\`](${commitUrl}) | Run: [#${context.runId}](${runUrl}) | ${passedCount} / ${totalExpected} Tests Run\n\n`;
              report += `> [!CAUTION]\n`;
              report += `> **Failures:**\n`;
              for (const f of failures) {
                report += `> - ${f}\n`;
              }
              report += `\n`;
            }

            // Compact 3-column true HTML table definition:
            // Columns:
            // 1. clean tick / cross indicating pass / fail (<sub>:white_check_mark:</sub> / <sub>:x:</sub>)
            // 2. plain sub-wrapped test token string (<sub>${token}</sub>)
            // 3. build metric (inline images + <sub>metric text</sub>)
            report += `<table>\n<tbody>\n`;

            for (const base of baseTestTokens) {
              for (const loader of ['fabric', 'neoforge']) {
                const token = `${base}.${loader}`;
                const suite = parsedSuites.find(s => s.token === token);
                const images = tokenImageMap[token] || [];

                const isPass = suite ? suite.passed : false;
                const statusIcon = isPass ? ':white_check_mark:' : ':x:';

                let metricContent = suite ? suite.notes : 'Test execution not recorded';
                if (!isPass && suite && suite.error) {
                  metricContent = `Error: ${suite.error}`;
                }

                let metricCell = '';
                if (prNumber && images.length > 0) {
                  const imgHtml = images.map(img =>
                    `<a href="${rawBase}/${img.file}?v=${sha}"><img src="${rawBase}/${img.file}?v=${sha}" width="90" title="${img.title}" alt="${img.label}" /></a>`
                  ).join('&nbsp;');
                  metricCell = `${imgHtml}<br /><sub>${metricContent}</sub>`;
                } else {
                  metricCell = `<sub>${metricContent}</sub>`;
                }

                report += `<tr>\n<td align="center"><sub>${statusIcon}</sub></td>\n<td><sub>${token}</sub></td>\n<td>${metricCell}</td>\n</tr>\n`;
              }
            }

            // Any unexpected watchdog timeouts or extra tests
            const extras = parsedSuites.filter(s => !baseTestTokens.some(b => s.token.startsWith(b)));
            for (const ex of extras) {
              const statusIcon = ex.passed ? ':white_check_mark:' : ':x:';
              report += `<tr>\n<td align="center"><sub>${statusIcon}</sub></td>\n<td><sub>${ex.token}</sub></td>\n<td><sub>${ex.notes}</sub></td>\n</tr>\n`;
            }

            report += `</tbody>\n</table>\n\n`;

            // Collapsible Detailed Logs
            if (detailedReports.length > 0) {
              report += `<details>\n<summary><b>🔍 Detailed Diagnostic Logs (${detailedReports.length} reports)</b></summary>\n\n`;
              for (const d of detailedReports) {
                report += `#### ${d.loaderName}: ${d.file}\n\n\`\`\`text\n${d.content.trim()}\n\`\`\`\n\n`;
              }
              report += `</details>\n\n`;
            }

            report += `---\n*Artifacts: [Download Raw Heightmaps & Diagnostic Outputs](${runUrl})*`;

            // 1. Write to GitHub Step Summary
            await core.summary.addRaw(report).write();

            // 2. Post or update the sticky comment on PR
            if (prNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: prNumber
              });

              const botComment = comments.find(c =>
                c.body.includes('verification-passed') ||
                c.body.includes('verification-failed') ||
                c.body.includes('FreeTerraForged Verification')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: botComment.id,
                  body: report
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body: report
                });
              }
            }

            // STRICT ENFORCEMENT: Fail the GitHub Actions job if verification failed or missing
            if (!overallPassed) {
              core.setFailed(`Preset Verification Failed: ${failures.join('; ')}`);
            }
