plugins {
    id "com.gradleup.shadow" version "9.2.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def defaultPresetDatagenOutput = layout.buildDirectory.dir("generated/default-preset-datagen")
def defaultPresetResourceOutput = layout.buildDirectory.dir("resources/main/ftf_default_preset")

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    runs {
        server {
            // Remove "nogui" so the vanilla Swing interface opens
            programArgs.remove("nogui")
        }
        defaultPresetData {
            server()
            name "Generate Default Preset Data"
            runDir "build/default-preset-datagen-run"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${defaultPresetDatagenOutput.get().asFile.absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=freeterraforged"
            vmArg "-Dfreeterraforged.datagen.exit=true"
        }
        benchmarkServer {
            server()
            name "Run Headless Worldgen Benchmark Server"
            runDir "build/benchmark-run"
            programArg "nogui"
            vmArg "-Xmx4G"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dfreeterraforged.benchmark.auto=true"
            vmArg "-Dfreeterraforged.benchmark.radius=${project.findProperty('ftfBenchmarkRadius') ?: '10'}"
            vmArg "-Dfreeterraforged.benchmark.x=${project.findProperty('ftfBenchmarkX') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.z=${project.findProperty('ftfBenchmarkZ') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.exit=true"
        }
    }
}

configurations {
    common
    shadowCommon
    architecturyTransformerClasspath
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    architecturyTransformerClasspath.extendsFrom compileClasspath
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modCompileOnly "maven.modrinth:biolith:3.0.14-fabric"
    architecturyTransformerClasspath "com.github.glitchfiend:TerraBlender-neoforge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
    architecturyTransformerClasspath "maven.modrinth:biolith:3.0.14-neoforge"
    architecturyTransformerClasspath "maven.modrinth:lithostitched:1.8.0+beta4-neoforge-21.1"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = "fabric"
    description = "Runs the remapped production artifact with Fabric's production server launcher"
    loaderVersion = rootProject.fabric_loader_version
    minecraftVersion = rootProject.minecraft_version
    runDir = file("run")
    jvmArgs.add("-Xmx4G")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

tasks.register("cleanStaleDefaultPresetResources", Delete) {
    delete(layout.buildDirectory.dir("resources/main/ftf_default_preset"))
}

tasks.register("syncDefaultPresetPack", Sync) {
    group = "build"
    description = "Generates and stages the built-in pack from Presets.makeFTFDefault()"
    dependsOn tasks.named("runDefaultPresetData")
    from(defaultPresetDatagenOutput.map { it.dir("ftf_default_preset") })
    into(defaultPresetResourceOutput)
    // Sync must run even when sources are unchanged so files removed by datagen are deleted.
    outputs.upToDateWhen { false }
}

tasks.named("runDefaultPresetData").configure {
    doFirst {
        delete(defaultPresetDatagenOutput.get().asFile)
    }
}

tasks.matching { ["runClient", "runServer", "runBenchmarkServer", "runClientRenderDoc", "jar", "shadowJar"].contains(it.name) }.configureEach {
    dependsOn tasks.named("syncDefaultPresetPack")
}

tasks.named("runBenchmarkServer").configure {
    doFirst {
        def benchDir = file("build/benchmark-run")
        delete(new File(benchDir, "world"))
        benchDir.mkdirs()
        new File(benchDir, "eula.txt").text = "eula=true\n"
        new File(benchDir, "server.properties").text = """\
level-type=freeterraforged\\:freeterraforged
level-seed=123456789
online-mode=false
spawn-protection=0
view-distance=10
simulation-distance=10
sync-chunk-writes=false
max-tick-time=-1
""".stripIndent()
    }
}

processResources {
    dependsOn tasks.named("cleanStaleDefaultPresetResources")
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("fabric-${rootProject.minecraft_version}")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
