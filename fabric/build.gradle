plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    runs {
        server {
            // Remove "nogui" so the vanilla Swing interface opens
            programArgs.remove("nogui")
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-fabric:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
    modCompileOnly "maven.modrinth:biolith:1.0.1-beta.1-fabric"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
    compileOnly "dev.architectury:architectury-injectables:1.0.13"
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

processResources {
    duplicatesStrategy "exclude"
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("fabric-${rootProject.minecraft_version}")

    doLast {
        def jarPath = archiveFile.get().asFile.toPath()
        def uri = java.net.URI.create("jar:" + jarPath.toUri())
        def env = [( "create" ): "false"]
        java.nio.file.FileSystems.newFileSystem(uri, env).withCloseable { fs ->
            def refmapPath = fs.getPath("freeterraforged-common-refmap.json")
            if (java.nio.file.Files.exists(refmapPath)) {
                def content = new String(java.nio.file.Files.readAllBytes(refmapPath), java.nio.charset.StandardCharsets.UTF_8)
                content = content.replace("Lnet/minecraft/class_1966;getNoiseBiome(", "Lnet/minecraft/class_1966;method_38109(")
                content = content.replace("Lnet/minecraft/class_4766;getNoiseBiome(", "Lnet/minecraft/class_4766;method_38109(")
                java.nio.file.Files.write(refmapPath, content.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            }
        }
    }
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    duplicatesStrategy "exclude"
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
