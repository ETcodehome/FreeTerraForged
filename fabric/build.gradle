plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    runs {
        server {
            // Remove "nogui" so the vanilla Swing interface opens
            programArgs.remove("nogui")
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    modCompileOnly "maven.modrinth:biolith:3.0.14-fabric"
    // The Fabric artifact declares a v1 class-tweaker through the legacy access-widener key,
    // which this Loom version cannot parse. The shared implementation is identical and the
    // NeoForge artifact is already Mojang-mapped, so use it only as the compile-time API.
    compileOnly "maven.modrinth:lithostitched:1.7.13-neoforge-21.1"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
    compileOnly "dev.architectury:architectury-injectables:1.0.13"
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = "fabric"
    description = "Runs the remapped production artifact with Fabric's production server launcher"
    loaderVersion = rootProject.fabric_loader_version
    minecraftVersion = rootProject.minecraft_version
    runDir = file("run")
    jvmArgs.add("-Xmx4G")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("fabric-${rootProject.minecraft_version}")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
